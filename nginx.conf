# AI-Generated: Web container proxy
# Generated-Date: 2026-10-26
# Description: Serves the built React app and forwards /api to FastAPI

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
